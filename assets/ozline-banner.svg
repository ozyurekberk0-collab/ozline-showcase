<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Ozline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2038"/>
      <stop offset="1" stop-color="#112B48"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00B7B4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00B7B4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="400"/></clipPath>
    <style>.t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }</style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <circle cx="1010" cy="200" r="330" fill="url(#glow)"/>

    <!-- Logo: oz + line -->
    <g transform="translate(63.5 56.7) scale(0.39)">
      <circle cx="170" cy="286" r="76" fill="none" stroke="#FFFFFF" stroke-width="52"/>
      <circle cx="170" cy="286" r="22" fill="#00B7B4"/>
      <path d="M320 210 H418 L320 362 H404" fill="none" stroke="#00B7B4" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="398,322 458,362 398,402" fill="#00B7B4" stroke="#00B7B4" stroke-width="14" stroke-linejoin="round"/>
    </g>
    <text x="239.8" y="208" class="t" font-size="154.4" font-weight="700" letter-spacing="-3" fill="#FFFFFF">line</text>

    <text x="92" y="268" class="t" font-size="25" font-weight="400" fill="#B9C7DA">Şirket içi sorun bildirme ve görev takibi</text>

    <g class="t" font-size="15" font-weight="600">
      <rect x="92" y="298" width="104" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="144" y="319" text-anchor="middle" fill="#E3EAF3">Next.js</text>
      <rect x="206" y="298" width="92" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="252" y="319" text-anchor="middle" fill="#E3EAF3">FastAPI</text>
      <rect x="308" y="298" width="118" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="367" y="319" text-anchor="middle" fill="#E3EAF3">PostgreSQL</text>
      <rect x="436" y="298" width="96" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="484" y="319" text-anchor="middle" fill="#E3EAF3">Ollama</text>
    </g>

    <!-- Bir sorunun yolu: Açık, Devam ediyor, Kapalı -->
    <g class="t" transform="translate(760 92)">
      <rect width="420" height="216" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="24" y="38" font-size="13" font-weight="700" fill="#8FA3BF" letter-spacing="1">BİR SORUNUN YOLU</text>

      <rect x="24" y="62" width="372" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.06"/>
      <circle cx="46" cy="82" r="7" fill="#F2A541"/>
      <text x="64" y="87" font-size="14.5" fill="#E3EAF3">Klima arızası bildirildi</text>
      <text x="380" y="87" font-size="12.5" text-anchor="end" fill="#8FA3BF">Açık</text>

      <rect x="24" y="110" width="372" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.06"/>
      <circle cx="46" cy="130" r="7" fill="#4C8DFF"/>
      <text x="64" y="135" font-size="14.5" fill="#E3EAF3">Teknik ekibe atandı</text>
      <text x="380" y="135" font-size="12.5" text-anchor="end" fill="#8FA3BF">Devam ediyor</text>

      <rect x="24" y="158" width="372" height="40" rx="8" fill="#00B7B4" fill-opacity="0.14" stroke="#00B7B4" stroke-opacity="0.5"/>
      <circle cx="46" cy="178" r="9" fill="#00B7B4"/>
      <path d="M41.5 178 l3 3 l6 -6.5" fill="none" stroke="#0C2038" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="183" font-size="14.5" font-weight="600" fill="#E8FBFA">Çözüldü ve kapatıldı</text>
      <text x="380" y="183" font-size="12.5" text-anchor="end" fill="#7FE0DD">Kapalı</text>
    </g>
  </g>
</svg>
